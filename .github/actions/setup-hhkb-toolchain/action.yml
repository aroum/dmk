name: Set up HHKB Arm toolchain
description: Install the pinned official Arm GNU Toolchain used for HHKB builds
runs:
  using: composite
  steps:
    - name: Install Arm GNU Toolchain 15.3.Rel2
      shell: bash
      env:
        ARM_GNU_VERSION: 15.3.rel2
        ARM_GNU_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
      run: |
        set -euo pipefail
        archive="arm-gnu-toolchain-${ARM_GNU_VERSION}-x86_64-arm-none-eabi.tar.xz"
        archive_path="${RUNNER_TEMP}/${archive}"
        toolchain_dir="${RUNNER_TOOL_CACHE}/arm-gnu-toolchain-${ARM_GNU_VERSION}"
        curl --fail --location --retry 3 \
          "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${ARM_GNU_VERSION}/${archive}" \
          --output "${archive_path}"
        printf '%s  %s\n' "${ARM_GNU_SHA256}" "${archive_path}" | sha256sum --check --strict
        mkdir -p "${toolchain_dir}"
        tar -xJf "${archive_path}" --strip-components=1 -C "${toolchain_dir}"
        printf '%s\n' "${toolchain_dir}/bin" >> "${GITHUB_PATH}"
        "${toolchain_dir}/bin/arm-none-eabi-gcc" --version
        test "$("${toolchain_dir}/bin/arm-none-eabi-gcc" -dumpfullversion)" = 15.3.1
