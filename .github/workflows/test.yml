name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Editor Unit Tests
        run: |
          node --test tests/test_editor.js

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Python Unit Tests
        run: |
          uv run python3 -m unittest discover tests
