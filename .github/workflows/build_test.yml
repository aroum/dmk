name: Build Firmware

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build-keyboards:
    name: Build ${{ matrix.keyboard }} (${{ matrix.mcu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: corne
            mcu: milandr
            args: "-c"
          - keyboard: corne
            mcu: rp2040
            args: "-c --uf2"
          - keyboard: jianovka
            mcu: milandr
            args: "-c"
          - keyboard: kabarga
            mcu: nrf52840
            args: "-c --uf2"
          # - keyboard: magneteno
          #   mcu: rp2350
          #   args: "-c --uf2"
          - keyboard: nizkoteno
            mcu: rp2040
            args: "-c --uf2"
          - keyboard: omsk
            mcu: rp2350
            args: "-c --uf2"
          - keyboard: pncateho
            mcu: nrf52840
            args: "-c --uf2"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build Firmware (${{ matrix.keyboard }} / ${{ matrix.mcu }})
        run: |
          chmod +x build_all.sh
          ./build_all.sh -b ${{ matrix.keyboard }} --mcu ${{ matrix.mcu }} ${{ matrix.args }}

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.keyboard }}-${{ matrix.mcu }}
          path: |
            build/dmk_*
          retention-days: 3
          if-no-files-found: error

  build-hhkb-classic:
    name: Build HHKB Classic ${{ matrix.variant }} (max ADC)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: classic
            defines: HHKB_RAPID_TRIGGER,HHKB_FACTORY_THRESHOLDS,HHKB_ADC_16MHZ,HHKB_ADC_OVERSAMPLING
          - variant: type-s
            defines: HHKB_TYPE_S,HHKB_RAPID_TRIGGER,HHKB_FACTORY_THRESHOLDS,HHKB_ADC_16MHZ,HHKB_ADC_OVERSAMPLING

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build HFB
        run: |
          chmod +x build_all.sh
          ./build_all.sh -b hhkb_classic --mcu stm32l072 -d "${{ matrix.defines }}" -c

      - name: Package HFB and VIA layout
        run: |
          python3 -m json.tool keyboards/hhkb_classic/via.json > /dev/null
          mkdir -p build/hhkb-release
          cp build/hhkb-script/*.hfb build/hhkb-release/
          cp keyboards/hhkb_classic/via.json build/hhkb-release/

      - name: Upload HFB
        uses: actions/upload-artifact@v7
        with:
          name: hhkb-classic-${{ matrix.variant }}-max-adc-hfb
          path: build/hhkb-release/
          retention-days: 3
          if-no-files-found: error
