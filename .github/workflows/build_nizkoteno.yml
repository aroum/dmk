name: Build Nizkoteno RP2040

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Initialize pico-sdk Submodule
        run: |
          git submodule update --init --recursive examples/raspberrypi/pico-sdk

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Firmware
        run: |
          chmod +x build_all.sh
          ./build_all.sh -b nizkoteno --mcu rp2040 -c --uf2

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmk_nizkoteno_rp2040.uf2
          path: build/dmk_nizkoteno_rp2040.uf2
